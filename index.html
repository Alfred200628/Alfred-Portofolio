<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulan Porto</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Garamond&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Garamond', serif;
      margin: 0;
      overflow-x: hidden;
      background: linear-gradient(-45deg, #cce3f3, #f0e6f7, #e6f5f0);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #333;
      transition: background 0.5s ease, color 0.5s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1em 2em;
    }

    .toggle-mode {
      cursor: pointer;
      font-size: 1.5em;
    }

    .dark-mode {
      background: linear-gradient(-45deg, #2c3e50, #4b79a1, #283e51);
      color: #fdfdfd;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2em;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: inherit;
      margin: 0 10px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #0077cc;
    }

    .social-icons {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 1em;
    }

    .social-icons a {
      font-size: 1.5em;
      color: inherit;
      transition: transform 0.3s ease;
    }

    .social-icons a:hover {
      transform: scale(1.3);
    }

    .profile-section {
      text-align: center;
      padding: 2em;
    }

    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .profile-pic:hover {
      transform: scale(1.1);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 2em;
    }

    .gallery img {
      width: 100%;
      border-radius: 20px;
      transition: transform 0.4s ease;
    }

    .gallery img:hover {
      transform: scale(1.1);
    }

    .click-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      animation: clickAnim 0.5s ease-out;
    }

    @keyframes clickAnim {
      from {
        width: 0;
        height: 0;
        opacity: 1;
      }
      to {
        width: 100px;
        height: 100px;
        margin-left: -50px;
        margin-top: -50px;
        opacity: 0;
      }
    }

    .comment-section,
    .contact-section {
      padding: 2em;
      max-width: 600px;
      margin: auto;
    }

    .comment-section input,
    .comment-section textarea,
    .contact-section input,
    .contact-section textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      font-family: 'Garamond', serif;
    }

    .comment-section button,
    .contact-section button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: #fff;
      cursor: pointer;
      font-family: 'Garamond', serif;
      transition: transform 0.3s ease;
    }

    .comment-section button:hover,
    .contact-section button:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <header>
    <h1>My Portfolio</h1>
    <div class="toggle-mode" onclick="toggleMode()">🌙</div>
  </header>

  <nav>
    <div>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
      <a href="#comments">Comments</a>
    </div>
    <div class="social-icons">
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/your-number" target="_blank"><i class="fab fa-whatsapp"></i></a>
    </div>
  </nav>

  <section class="profile-section">
    <img class="profile-pic" src="c:\Users\acer\Pictures\Profile.jpeg" alt="Profile Picture">
    <h2>Your Name</h2>
    <p>Email: bulanwaruwu324@gmail.com</p>
    <p>Address: Pematangsiantar, Horas Alley, North Sumatra</p>
  </section>

  <section class="gallery" id="gallery">
    <img src="c:\Users\acer\Pictures\Octavia Resto RGB-01.jpg" alt="Image 1">
    <img src="c:\Users\acer\Pictures\Karisa RGB-01.jpg" alt="Image 2">
    <img src="c:\Users\acer\Pictures\PosterM'NYALA_AlfredWaruhu_TRMG-1B-01.jpg" alt="Image 3">
    <img src="c:\Users\acer\Pictures\AI Designer-Minimalist mobile phone logo mockup (1730367396).png" alt="Image 4">
    <img src="c:\Users\acer\Pictures\AI Designer-Logo close-up paper display effect (1730367071).jpeg" alt="Image 5">
    <img src="c:\Users\acer\Pictures\mediamodifier_image (2).jpeg" alt="Image 6">
  </section>

  <section class="contact-section" id="contact">
    <h2>Contact Me</h2>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea placeholder="Your Message"></textarea>
    <button>Send</button>
  </section>

  <section class="comment-section" id="comments">
    <h2>Leave a Comment</h2>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea placeholder="Your Comment"></textarea>
    <button>Submit</button>
  </section>

  <script>
    function toggleMode() {
      document.body.classList.toggle('dark-mode');
      const icon = document.querySelector('.toggle-mode');
      icon.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    document.addEventListener('click', function (e) {
      const clickDiv = document.createElement('div');
      clickDiv.className = 'click-effect';
      clickDiv.style.left = `${e.pageX}px`;
      clickDiv.style.top = `${e.pageY}px`;
      document.body.appendChild(clickDiv);
      setTimeout(() => clickDiv.remove(), 500);
    });
  </script>
</body>

</html>
